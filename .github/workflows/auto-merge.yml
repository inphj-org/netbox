name: 자동 머지

# PR 검증이 끝나면 그 커밋의 체크가 **전부** 초록인지 보고 머지한다 — 사람 PR 도 포함(사용자 결정 2026-09-13).
# Free org 라 GitHub 보호 규칙이 없어 이 워크플로가 그 역할이다. 그만큼 PR 체크를 믿어야 한다.
#
# 함정 셋:
#   - GITHUB_TOKEN 이 한 머지는 push 이벤트를 안 만들어 deploy.yml 이 안 돈다. 그래서 머지 뒤
#     deploy.yml 을 workflow_dispatch 로 직접 부른다(그건 GITHUB_TOKEN 으로도 허용된다).
#   - workflow_run 워크플로는 **main 에 있는 판**이 돈다. PR 에서 이 파일을 고쳐도 머지 전엔 안 바뀐다.
#     처음 넣는 PR 은 사람이 머지해야 한다.
#   - **대기 중인 run 은 새 run 이 오면 취소된다**(같은 concurrency 그룹, cancel-in-progress: false 는
#     진행 중인 것만 지킨다). 전에는 잡이 `run.pull_requests`(자기를 부른 PR)만 봐서, 취소된 run 의 PR 을
#     **아무도 안 집었다** — 체크가 초록인데 조용히 안 머지된 채 남는다(9f 보고, 2026-09-13 3회 관측).
#     그래서 **열린 PR 을 전부 훑는다.** 어느 run 이든 준비된 PR 을 회수하므로 취소가 나도 자기치유된다.
#   - **충돌 난 PR 에는 GitHub 이 PR 검증을 안 돌린다** — 체크가 영영 안 생긴다. 그래서 체크 확인보다 **먼저**
#     충돌을 보고 PR 에 댓글을 단다(헤드 커밋마다 한 번). 전에는 워크플로 로그에 경고만 남겨 아무도 몰랐다
#     (2026-09-14: 62 의 #113·#115 가 체크 초록인 채 main 과 충돌해 20시간 넘게 멈춰 있었다).

on:
  workflow_run:
    # 포크는 체크를 남기는 워크플로가 셋이다. 그 중 마지막에 끝난 것이 부르지 않으면 초록 PR 이 다음 PR 까지 멈춘다
    # (2026-09-14 #4: 포크 검증이 끝났을 때 CodeQL 이 도는 중이라 "아직" 으로 넘기고, CodeQL 이 끝나도 아무도 다시 안 불렀다).
    # 스크립트는 열린 PR 을 전부 훑고 미완 체크가 있으면 넘기므로 여러 번 돌아도 해가 없다.
    workflows: ["포크 검증", "CI", "CodeQL"]
    types: [completed]

concurrency:
  group: auto-merge          # 머지·배포 호출을 한 번에 하나씩. 순서가 섞이면 배포 기준 커밋이 어긋난다
  cancel-in-progress: false

permissions:
  contents: write            # 머지·브랜치 삭제
  pull-requests: write       # 머지
  issues: write              # 충돌 난 PR 에 알림 댓글
  actions: write             # deploy.yml workflow_dispatch
  checks: read

jobs:
  # 작업 ID 는 ASCII 만 된다(pr.yml 주석 참고). 이 잡의 보이는 이름 "머지"는 아래 스크립트가
  # 체크 목록에서 자기 자신을 빼는 데 쓴다 — 바꾸면 스크립트도 같이.
  merge:
    name: 머지
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ME = '머지';
            const SELF = `${owner}/${repo}`;
            // 1. 열린 PR 을 전부 본다. 이 run 을 부른 PR 만 보면, 취소된 run 의 PR 이 영영 안 머지된다.
            const { data: open } = await github.rest.pulls.list({
              owner, repo, state: 'open', base: 'main', per_page: 100 });
            core.info(`열린 PR ${open.length}건 검사`);
            let merged = 0;
            for (const p of open) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
              // 2. 포크 PR 은 머지하지 않는다. 전에는 run.pull_requests 가 비어 우연히 걸러졌는데,
              //    열린 PR 을 훑으면 포크도 목록에 들어오므로 **여기서 명시적으로** 막아야 한다.
              const from = pr.head.repo ? pr.head.repo.full_name : null;
              if (from !== SELF) { core.info(`#${pr.number} 건너뜀: 포크/삭제된 원본 (${from})`); continue; }
              if (pr.draft || pr.base.ref !== 'main') {
                core.info(`#${pr.number} 건너뜀: draft=${pr.draft} base=${pr.base.ref}`);
                continue;
              }
              // 2b. 충돌을 체크보다 먼저 본다. 충돌 난 PR 에는 GitHub 이 PR 검증을 안 돌려 체크가 영영 안 생기므로,
              //     체크 확인 뒤에 보면 그런 PR 은 여기까지 오지도 못한다. mergeable 은 GitHub 이 뒤늦게 계산하므로 잠깐 기다린다.
              let m = pr;
              for (let i = 0; i < 5 && m.mergeable === null; i++) {
                await new Promise(r => setTimeout(r, 3000));
                m = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              }
              if (m.mergeable === false) {
                // 헤드 커밋마다 한 번만 단다. 같은 헤드에 run 이 여러 번 와도 댓글이 쌓이지 않게 표식으로 거른다.
                const mark = `<!-- auto-merge-conflict:${pr.head.sha} -->`;
                // 알림이 실패해도(권한·API 오류) 다른 PR 의 머지를 막으면 안 된다 - 잡아서 경고만 남기고 넘어간다.
                try {
                  const cs = await github.paginate(github.rest.issues.listComments,
                    { owner, repo, issue_number: pr.number, per_page: 100 });
                  if (cs.some(c => (c.body || '').includes(mark))) {
                    core.info(`#${pr.number} 충돌 - 이 헤드에는 이미 알렸다`);
                  } else {
                    await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: [
                      mark,
                      `자동 머지: **main 과 충돌해서 머지하지 못했습니다** (헤드 \`${pr.head.sha.slice(0, 7)}\`).`,
                      '',
                      '- 충돌 난 PR 에는 GitHub 이 PR 검증을 돌리지 않습니다. 이대로 두면 계속 멈춰 있습니다.',
                      '- 이 PR 을 올린 세션이 main 을 받아 충돌을 풀고 다시 올려 주세요. 새 커밋이 올라오면 검증과 자동 머지가 다시 돕니다.',
                      '- 같은 헤드 커밋에는 이 알림을 다시 달지 않습니다.',
                    ].join('\n') });
                    core.warning(`#${pr.number} 충돌 - PR 에 알림 댓글을 달았다`);
                  }
                } catch (e) {
                  core.warning(`#${pr.number} 충돌 알림 실패(머지는 계속): ${e.message}`);
                }
                continue;
              }
              const sha = pr.head.sha;
              // 3. 그 커밋의 체크 전부 - 이 잡 자신은 뺀다. 하나라도 미완·실패면 안 한다.
              //    아직 도는 중인 PR 은 흔하므로 실패로 처리하지 않고 넘어간다(다음 run 이 다시 본다).
              const { data: cr } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
              const others = cr.check_runs.filter(c => c.name !== ME);
              const bad = others.filter(c => c.status !== 'completed' || !['success', 'neutral', 'skipped'].includes(c.conclusion));
              const verified = others.some(c => c.name === '포크 규칙' && c.conclusion === 'success');
              if (!verified || bad.length) {
                core.info(`#${pr.number} 아직: 검증통과=${verified} 미완·실패=${bad.map(c => c.name + ':' + (c.conclusion || c.status)).join(',') || '없음'}`);
                continue;
              }
              // 4. 머지. 충돌은 위(2b)에서 걸렀다 — 여기서 m 을 다시 선언하면 같은 블록의 let 중복으로 문법 오류가 난다.
              const res = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge', sha });
              core.info(`#${pr.number} 머지 → ${res.data.sha}`);
              merged++;
              try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }); }
              catch (e) { core.info('브랜치 삭제 실패(무시): ' + e.message); }
            }
            // 5. 배포 호출 - GITHUB_TOKEN 머지는 push 이벤트를 안 낸다. 여러 건을 머지했어도 한 번만 부른다
            //    (deploy.py plan 이 ci-deployed 태그를 기준으로 보므로 한 번이면 전부 덮는다).
            //    deploy.yml 이 없는 저장소는 건너뛴다.
            if (!merged) { core.info('머지한 것 없음 - 배포 호출 생략'); return; }
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'deploy.yml', ref: 'main' });
              core.info(`${merged}건 머지, deploy.yml 호출(main)`);
            } catch (e) {
              if (e.status === 404) core.info('deploy.yml 없음 - 배포 호출 생략'); else throw e;
            }
